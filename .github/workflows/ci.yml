name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: node --experimental-strip-types scripts/check-lines.ts
      - run: node --experimental-strip-types scripts/check-review.ts
      - run: node --experimental-strip-types scripts/check-puzzles.ts
      - run: node --experimental-strip-types scripts/check-sync.ts
